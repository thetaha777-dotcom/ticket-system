server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: every unknown path (e.g. /e/some-event) is answered with index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Built files have a hash in their name, so browsers may cache them for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
