name: biletflow_checkin
description: "BiletFlow: buy event tickets and keep them on your phone; check tickets at the entrance (staff)"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.14.0
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
 cupertino_icons: ^1.0.8
  http: ^1.6.0
  mobile_scanner: ^7.5.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  qr_flutter: ^4.1.0
  flutter_svg: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
 flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
