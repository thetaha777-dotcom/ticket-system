# BiletFlow - local / demonstration deployment.
#
#   docker compose up --build
#
#   Web app   http://localhost:8080
#   API docs  http://localhost:8000/docs
#   Mailbox   http://localhost:8025      (every email the platform "sends" lands here)
#
# Demo accounts are listed in README.md (password: Demo12345).
#
# To use it from a phone on the same Wi-Fi (check-in app, scanning a Campaign QR code), tell it
# the address of this computer in the network and rebuild:
#
#   PUBLIC_HOST=192.168.1.20 docker compose up --build
#
# Links in emails, QR codes and the web app then point to http://192.168.1.20:... instead of localhost.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biletflow
      POSTGRES_PASSWORD: biletflow
      POSTGRES_DB: biletflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biletflow -d biletflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Mailpit catches all outgoing email and shows it in a web inbox. Nothing leaves your computer.
  mail:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  api:
    build: .
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://biletflow:biletflow@db:5432/biletflow
      # Change this for anything that is reachable from the internet:
      SECRET_KEY: ${SECRET_KEY:-demo-only-secret-change-me-32-bytes-long}
      FRONTEND_URL: http://${PUBLIC_HOST:-localhost}:8080
      API_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:8000
      CORS_ORIGINS: http://${PUBLIC_HOST:-localhost}:8080,http://localhost:8080,http://localhost:5173
      EMAIL_BACKEND: smtp
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SEED_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/code/media

  web:
    build:
      context: ./frontend
      args:
        # The address of the API as seen from the visitor's browser. It is compiled into the web app.
        VITE_API_URL: http://${PUBLIC_HOST:-localhost}:8000
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  media:
