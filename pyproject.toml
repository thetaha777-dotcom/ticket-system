[project]
name = "biletflow"
version = "1.0.0"
description = "BiletFlow: self-service event ticketing platform for Kazakhstan (academic MVP) - FastAPI backend"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
# Dependencies are installed from requirements.txt (see README.md).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "B008",   # FastAPI's Depends(...) in function defaults is the intended style
    "E501",   # line length is handled by the formatter setting above
    "F821",   # forward references to models in other modules ("Event", "User", ...)
]
